<!DOCTYPE html>
<html lang="en" data-build="20260823-brand1">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="supported-color-schemes" content="light" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="darkreader-lock" />
  <meta name="description" content="Your first hour at PRSUT, fitted to how you move." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.json?v=20260823-brand1" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-v1.png" />
  <link rel="icon" href="./icons/icon-192-v1.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <title>PRSUT Movement Map</title>
  <link rel="stylesheet" href="./css/app.css?v=20260823-brand1" />
</head>
<body>
  <header>
    <img class="brand" src="./icons/prsut-logo.png" width="168" height="52" alt="PRSUT Fitness" />
    <h1>Your first hour</h1>
    <div class="dots" id="dots" aria-hidden="true"><span class="on"></span><span></span><span></span><span></span></div>
  </header>
  <main>
    <section id="welcome" class="card">
      <p>A few easy moves on camera. Then we know how to start you.</p>
      <div class="actions">
        <button class="btn" id="goDetails" type="button">Begin</button>
      </div>
    </section>

    <section id="details" class="card is-hidden" hidden>
      <label for="name">Your name</label>
      <input id="name" autocomplete="name" />
      <label for="phone">Phone</label>
      <input id="phone" type="tel" autocomplete="tel" inputmode="tel" />
      <p class="hint">So we can save your intro time.</p>
      <label for="email">Email <span class="fine">(optional)</span></label>
      <input id="email" type="email" autocomplete="email" />
      <label for="prefHour">When can you come?</label>
      <select id="prefHour">
        <option value="5am">5:00 a.m.</option>
        <option value="9am">9:00 a.m.</option>
        <option value="430">4:30 p.m.</option>
        <option value="530" selected>5:30 p.m.</option>
        <option value="sat">Saturday</option>
      </select>
      <div class="consent">
        <input id="consent" type="checkbox" />
        <label for="consent">Use the camera on this phone.</label>
      </div>
      <div class="actions">
        <button class="btn" id="goCamera" type="button">Continue</button>
        <button class="btn secondary is-hidden" id="useDemo" type="button" hidden>Skip camera</button>
      </div>
    </section>

    <section id="camera" class="card stage-card is-hidden" hidden>
      <h2 id="moveTitle">Stand tall</h2>
      <p class="cue" id="liveCue">Stand where we can see you.</p>
      <p class="fine" id="camStatus"></p>
      <p class="fine" id="moveCount"></p>
      <div class="stage">
        <video id="cam" playsinline muted autoplay></video>
        <canvas id="overlay"></canvas>
      </div>
      <div class="holdbar"><i id="holdFill"></i></div>
      <div class="actions">
        <button class="btn" id="captureBtn" type="button">Keep this</button>
        <button class="btn secondary is-hidden" id="skipMove" type="button" hidden>Skip this one</button>
      </div>
    </section>

    <section id="report" class="card is-hidden" hidden>
      <h2 id="reportTitle">Here is how we will start you</h2>
      <p id="hourLine"></p>
      <div id="notes"></div>
      <h2>On day one</h2>
      <div id="scales"></div>
      <div id="ratiosWrap" class="is-hidden" hidden>
        <h2>For your coach</h2>
        <div id="ratios"></div>
      </div>
      <div class="thumbs" id="thumbs"></div>
      <p class="fine" id="disclaimer" hidden></p>
      <p id="coachSign">PRSUT Fitness</p>
      <p class="fine is-hidden" hidden>Hello, <span id="hello">friend</span>.</p>
      <div class="actions no-print">
        <button class="btn" id="bookBtn" type="button">Book my intro</button>
        <button class="btn secondary" id="printBtn" type="button">Print</button>
        <button class="btn secondary" id="mapBtn" type="button">A few questions first</button>
      </div>
    </section>
  </main>
  <footer class="fine">PRSUT Fitness</footer>
  <button class="fab-back is-hidden" id="fabBack" type="button" hidden>Back</button>
  <div id="installBanner">
    <p>Keep this on your phone</p>
    <div class="actions">
      <button class="btn" id="installHow" type="button">How</button>
      <button class="btn secondary" id="installLater" type="button">Not now</button>
    </div>
  </div>
  <div id="toast" hidden></div>
  <script type="module" src="./js/app.js?v=20260823-brand1"></script>
</body>
</html>
